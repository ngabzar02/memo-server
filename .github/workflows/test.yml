name: test
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps + test
        run: |
          pip install .[test]
          pip install ruff
      - name: Lint (pyflakes F: unused/undefined/format — bukan gaya)
        run: ruff check -q --select F src tests bench
      - name: Selfcheck
        run: |
          python -m memo.store
          python -m memo.ingest
          python -m memo.registry
      - name: Tests
        run: pytest tests/ -q -m "not network"