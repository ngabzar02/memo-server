name: build-cache
on:
  push:
    branches: [main]
    paths: ["src/**", "cache-libs.txt", "aliases.json", "builtins.json", "pyproject.toml", ".github/workflows/cache.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  HF_HOME: $HOME/.hf
  FASTEMBED_CACHE_PATH: $HOME/.fastembed
  HF_HUB_DOWNLOAD_TIMEOUT: "120"
  HF_HUB_DISABLE_PROGRESS_BARS: "1"
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Cache model HF (embed + rerank)
        uses: actions/cache@v5
        with:
          path: |
            ~/.hf
            ~/.fastembed
            ~/.cache/memo
          key: hf-${{ hashFiles('pyproject.toml') }}
      - name: Install memo
        run: pip install --quiet .
      - name: Build cache (ingest semua lib + embed penuh)
        run: memo --build-cache 2>&1 | tee /tmp/build-cache.log
      - name: Package docs.db
        run: gzip -k ~/.local/share/memo/docs.db && mv ~/.local/share/memo/docs.db.gz memo-cache.db.gz
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: cache-${{ github.sha }}
          files: memo-cache.db.gz
      - name: Step summary
        if: always()
        run: python scripts/ci-summary-cache.py /tmp/build-cache.log >> "$GITHUB_STEP_SUMMARY"
