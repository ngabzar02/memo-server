name: cache

on:
  workflow_dispatch:
  push:
    paths:
      - "src/**"
      - "cache-libs.txt"
      - "pyproject.toml"

jobs:
  build-cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install --quiet .
      - name: Warmup semua library (fetch + embed + index)
        run: |
          python -m memo.server --warmup --force $(cat cache-libs.txt | grep -v '^#' | grep -v '^$') 2>&1
      - name: Cek isi DB
        run: |
          python -c "
          from memo import store
          c = store.connect()
          libs = c.execute('SELECT COUNT(*) FROM libs').fetchone()[0]
          chunks = c.execute('SELECT COUNT(*) FROM chunks').fetchone()[0]
          print(f'libs: {libs}, chunks: {chunks}')
          assert chunks > 1000, 'cache kosong!'
          "
      - name: Publish release cache-latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete cache-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create cache-latest docs.db \
            --title "memo cache" \
            --notes "Pre-built docs.db ($(date -u +%Y-%m-%dT%H:%MZ)). Download: https://github.com/ngabzar02/memo-server/releases/latest/download/docs.db"
      - name: Trigger bench
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run bench.yml
