name: bench

on:
  push:
    paths:
      - "src/**"
      - "bench/**"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Cache pip
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
      - name: Install
        run: pip install --quiet .
      - name: Selfcheck (smoke test modul)
        run: |
          python -m memo.ingest
          python -m memo.registry
          python -m memo.store
          python -m memo.rerank || echo "rerank selfcheck skipped (model/onnx tidak tersedia)"
      - name: Run bench (20 query vs Context7)
        run: python bench/bench.py
      - name: Upload bench results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: bench-results
          path: bench/results/
          if-no-files-found: warn
          retention-days: 14
      - name: Step summary
        if: always()
        run: python scripts/ci-summary-bench.py bench/results >> "$GITHUB_STEP_SUMMARY"
