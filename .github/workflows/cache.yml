name: cache
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: cache-build
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install .
      - name: Resume from last release
        run: |
          mkdir -p ~/.local/share/memo
          if curl -fLsSL -o /tmp/cache.db.gz \
              "https://github.com/${{ github.repository }}/releases/download/cache-build/memo-cache.db.gz"; then
            gzip -d -c /tmp/cache.db.gz > ~/.local/share/memo/docs.db
            echo "resume: DB restorasi ($(ls -lh ~/.local/share/memo/docs.db | awk '{print $5}'))"
          else
            echo "resume: release pertama, mulai dari nol"
          fi
      - name: Build cache
        run: python -m memo.server --build-cache
      - name: Gzip DB
        run: gzip -kf ~/.local/share/memo/docs.db
      - name: Upload release
        run: |
          set -euo pipefail
          gh release delete cache-build --repo "${{ github.repository }}" --yes >/dev/null 2>&1 || true
          gh release create cache-build "$HOME/.local/share/memo/docs.db.gz" \
            --repo "${{ github.repository }}" \
            --title "memo cache (build $(date -u +%Y%m%dT%H%M))" \
            --notes "Pre-built docs.db dari --build-cache di GitHub Actions. Unduh di ponsel: memo --fetch-cache" >/dev/null
          echo "release: https://github.com/${{ github.repository }}/releases/tag/cache-build"