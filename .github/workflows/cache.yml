name: build-cache
on:
  push:
    branches: [main]
    paths: ["src/**", "cache-libs.txt", "aliases.json", "builtins.json", "pyproject.toml", ".github/workflows/cache.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install memo
        run: pip install --quiet .
      - name: Build cache (ingest semua lib + embed penuh)
        run: memo --build-cache
      - name: Package docs.db
        run: gzip -k ~/.local/share/memo/docs.db && mv ~/.local/share/memo/docs.db.gz memo-cache.db.gz
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: cache-${{ github.sha }}
          files: memo-cache.db.gz
